<!DOCTYPE html>
<html>
<head>
  <title>Madac Minds: Smart Path</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f4f7fb;
      padding: 20px;
    }
   .logo-container{
    text-align:center;
    margin-bottom:20px;
   }

   .logo{
    width:200px;
    height: 100px;
   }
    .container {
      width: 80%;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 10px lightgray;
    }

    h1 {
      color: #1f4e79;
      text-align: center;
    }

    textarea, input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid gray;
      box-sizing: border-box;
    }

    button {
      background-color: #1f4e79;
      color: white;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .box {
      background-color: #eef5ff;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      white-space: pre-line;
    }
  </style>
</head>

<body>
<div class="logo-container">
    <img src="asset-2.png" class="logo">
</div>
<div class="container">
  <h1>Madac Minds: Smart Path</h1>
  <p style="text-align:center;">AI Writing Assistant</p>

  <h3>Student Name</h3>
  <input type="text" id="studentName" placeholder="Enter your name">

  <h3>Writing Task</h3>
  <textarea id="studentText" rows="8" placeholder="Write your paragraph here..."></textarea>

  <button onclick="checkWriting()">Check My Writing</button>

  <div class="box">
    <h3>AI Feedback</h3>
    <p id="result">AI correction will appear here.</p>
  </div>
  <button onclick="readFeedback()">
  🔊 Listen to Feedback
</button>
<button onclick="stopAudio()">
  ⏹ Stop Audio
</button>
</div>

<script>
async function checkWriting() {
  let text = document.getElementById("studentText").value;

  if (text === "") {
    alert("Please write your paragraph first.");
    return;
  }

  document.getElementById("result").innerText = "Checking your writing...";

  try {
    const response = await fetch("https://smartpath-ai-4geu.onrender.com/check-writing", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text: text })
    });

    const data = await response.json();

    if (data.result) {
      document.getElementById("result").innerText = data.result;
    } else {
      document.getElementById("result").innerText = "Error: " + data.error;
    }

  } catch (error) {
    document.getElementById("result").innerText =
      "Cannot connect to AI server. Make sure server.js is running.";
  }
}
function readFeedback() {
  let feedbackText = document.getElementById("result").innerText;

  if (feedbackText === "" || feedbackText.includes("AI correction will appear")) {
    alert("Please check the writing first, then listen.");
    return;
  }

  let currentSpeech;

function readFeedback() {
  let feedbackText = document.getElementById("result").innerText;

  if (feedbackText === "" || feedbackText.includes("AI correction will appear")) {
    alert("Please check the writing first, then listen.");
    return;
  }

  window.speechSynthesis.cancel();

  setTimeout(function () {
    currentSpeech = new SpeechSynthesisUtterance(feedbackText);
    currentSpeech.lang = "en-US";
    currentSpeech.volume = 1;
    currentSpeech.rate = 0.75;
    currentSpeech.pitch = 1;

    window.speechSynthesis.speak(currentSpeech);
  }, 300);
}

function stopAudio() {
  window.speechSynthesis.cancel();
}

</script>

</body>
</html>
